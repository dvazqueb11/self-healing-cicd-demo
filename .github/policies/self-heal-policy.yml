# Deterministic self-heal policy.
#
# This file is read by scripts/evaluate_policy.py. It is intentionally
# plain, readable configuration (no scripting) so policy decisions are
# auditable without reading code.
#
# The policy engine fails closed: if a scenario is missing, if evidence
# falls outside the declared limits, or if a proposed change touches a
# forbidden path, remediation is denied and an escalation issue is
# created instead of a pull request.

schema_version: "1.0"

# Paths that remediation may NEVER touch, regardless of scenario. The
# policy engine checks every changed file in a proposed patch against
# this list before any scenario-specific rule is evaluated.
globally_forbidden_paths:
  - ".github/workflows/"
  - ".github/policies/"
  - "framework/policies/"
  - "CMakeLists.txt"
  - "Makefile"
  - "benchmarks/performance_check.cpp"
  - "tests/test_framework.hpp"
  - "tests/test_main.cpp"
  - "SECURITY.md"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  - "LICENSE"
  - ".gitignore"
  - "scripts/"
  - "framework/"

scenarios:
  easy-unit-test:
    allowed_failure_category: unit-test-failure
    permitted_paths:
      - "src/job_processor.cpp"
      - "include/job_processor.hpp"
    forbidden_paths:
      - "tests/"
      - "benchmarks/"
    max_changed_files: 2
    max_inserted_lines: 20
    max_deleted_lines: 20
    required_validation_profile: unit-test-remediation
    runtime_budget_minutes: 10
    max_attempts: 1

  medium-low-coverage:
    allowed_failure_category: coverage-gap
    permitted_paths:
      - "tests/"
    forbidden_paths:
      - "src/"
      - "include/"
      - "benchmarks/"
    max_changed_files: 3
    max_inserted_lines: 60
    max_deleted_lines: 10
    required_validation_profile: coverage-remediation
    runtime_budget_minutes: 10
    max_attempts: 1

  advanced-performance:
    allowed_failure_category: performance-regression
    permitted_paths:
      - "src/job_processor.cpp"
      - "include/job_processor.hpp"
    forbidden_paths:
      - "tests/"
      - "benchmarks/"
    max_changed_files: 2
    max_inserted_lines: 40
    max_deleted_lines: 40
    required_validation_profile: performance-remediation
    runtime_budget_minutes: 10
    max_attempts: 1

# Conditions under which the policy engine abstains (denies remediation)
# independent of scenario-specific rules. These are documented here for
# auditability; they are enforced in scripts/evaluate_policy.py.
abstention_conditions:
  - "evidence failed schema validation"
  - "evidence failure_category does not match the scenario's allowed_failure_category"
  - "attempt_number exceeds max_attempts for the scenario"
  - "a changed file matches a globally forbidden path"
  - "a changed file matches a scenario-specific forbidden path"
  - "a changed file is outside every permitted path for the scenario"
  - "changed-file count exceeds max_changed_files"
  - "inserted or deleted line count exceeds the scenario's limits"
  - "runtime_budget.elapsed_minutes exceeds runtime_budget_minutes"
