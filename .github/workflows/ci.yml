name: CI

# Deterministic build/test/coverage/benchmark pipeline. This workflow
# contains no AI calls and no network access beyond the standard GitHub
# Actions runner image + apt packages. It is the same pipeline a human
# contributor's pull request is held to, and it is also what every
# self-heal remediation is ultimately re-validated against: if a
# remediation doesn't make the tests pass / coverage sufficient /
# benchmark fast again, this workflow fails and the PR cannot merge.
#
# On a pull request, every deterministic check always runs to
# completion (via `continue-on-error`) so a normalized evidence
# artifact can be produced *before* the job is allowed to fail -- this
# is what the self-heal-remediation workflow (triggered by this
# workflow's `workflow_run` completion) consumes. `pull_request` has no
# `branches:` filter so it also runs on a remediation's own stacked fix
# PR, which targets the developer's branch, not `main`.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, coverage, benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr lcov

      - name: Configure (with coverage instrumentation, once)
        run: cmake -S . -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build (once)
        run: cmake --build build -j 4

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -E performance_policy

      - name: Measure coverage
        id: coverage
        continue-on-error: true
        run: |
          DIFF_AGAINST="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch --depth=1 origin "${{ github.event.pull_request.base.ref || 'main' }}" 2>/dev/null || true
          # Deliberately a single invocation, not a `||`-chained fallback
          # to a plain-threshold-only re-run: measure_coverage.py already
          # degrades gracefully on its own when --diff-against resolves to
          # an unfetchable ref (git diff against a missing ref returns an
          # empty, non-fatal diff, so changed-line coverage trivially
          # passes with zero added lines -- see its own docstring). A
          # shell-level `||` fallback here cannot distinguish that
          # infra-only case from a *real* changed-line coverage violation
          # (both make the first invocation's process exit non-zero), and
          # silently discarding a real violation by falling back to the
          # weaker check would defeat the whole changed-line coverage gate.
          python3 scripts/measure_coverage.py --build-dir build --threshold 95 \
            --diff-against "$DIFF_AGAINST" --output build/coverage.json
          cat build/coverage.json

      - name: Run performance benchmark
        id: benchmark
        continue-on-error: true
        run: ./build/performance_check

      - name: Collect evidence (pull requests only; always runs, even on failure)
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/collect_evidence.py \
            --build-dir build \
            --repository "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --start-time-epoch "$(date -d "${{ github.event.pull_request.updated_at }}" +%s 2>/dev/null || date +%s)"

      - name: Upload evidence artifact
        if: always() && github.event_name == 'pull_request' && hashFiles('.evidence/evidence.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: self-heal-evidence
          path: .evidence/
          retention-days: 7
          # .evidence/ is a dot-prefixed (hidden) directory, and
          # actions/upload-artifact excludes hidden files/directories
          # by default (since 2024-09) to avoid accidentally leaking
          # dotfiles like .env -- without this, the artifact silently
          # uploads zero files and the remediation workflow has
          # nothing to download.
          include-hidden-files: true

      - name: Run automation test suite
        run: python3 tests/automation/run_all.py

      - name: Scan for secrets / internal references (public-repo hygiene)
        run: python3 scripts/check_public_repo.py

      - name: Assert all deterministic checks passed
        if: always()
        run: |
          status=0
          [ "${{ steps.unit_tests.outcome }}" = "success" ] || { echo "::error::unit tests failed"; status=1; }
          [ "${{ steps.coverage.outcome }}" = "success" ] || { echo "::error::coverage check failed"; status=1; }
          [ "${{ steps.benchmark.outcome }}" = "success" ] || { echo "::error::performance benchmark failed"; status=1; }
          exit $status

  policy-guard:
    name: Universal forbidden-path / diff-size guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful for pull requests, where there is a base ref to
    # diff against. Runs independently of build-test so a forbidden-path
    # violation is reported even if the build itself happens to pass.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check globally forbidden paths were not touched
        run: |
          python3 scripts/check_global_forbidden_paths.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}"
